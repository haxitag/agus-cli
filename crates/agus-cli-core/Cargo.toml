[package]
name = "agus-cli-core"
version = "0.1.0"
edition = "2021"

[dependencies]
agus-core-domain = { path = "../agus-core-domain" }
agus-forge-handoff = { path = "../agus-forge-handoff" }
agus-secret-store = { path = "../agus-secret-store" }
agus-ssh = { path = "../agus-ssh" }
agus-storage = { path = "../agus-storage" }
argon2 = "0.5"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
cipher = "0.4"
des = "0.8"
md-5 = "0.10"
rand_core = { version = "0.6", features = ["getrandom"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shell-words = "1"
thiserror = "1"

[dev-dependencies]
tempfile = "3"
