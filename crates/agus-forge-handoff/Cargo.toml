[package]
name = "agus-forge-handoff"
version = "0.1.0"
edition = "2021"
description = "Parse and validate Forge forge_ops_handoff.json for Agus import"

[dependencies]
agus-core-domain = { path = "../agus-core-domain" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "1"

[dev-dependencies]
tempfile = "3"
