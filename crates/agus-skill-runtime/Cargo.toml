[package]
name = "agus-skill-runtime"
version = "0.1.0"
edition = "2021"
description = "Agus Ops Skill runtime: load playbooks, enforce permissions, evidence, and human-gated proposals"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "1"
toml = "0.8"
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3"
